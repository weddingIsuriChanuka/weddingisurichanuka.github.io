<!DOCTYPE html>
<html lang="en" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isuri &amp; Chanuka – Wedding Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
:root{--page:#ffcfc5;--panel:#fff4f0;--ink:#843f34;--line:#efb3a6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#3a1f1b;--panel:#4a2924;--ink:#ffd9d0;--line:#7a4a42}}
:root[data-theme="dark"]{--page:#3a1f1b;--panel:#4a2924;--ink:#ffd9d0;--line:#7a4a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.6;padding:0 0 40px}
.wrap{max-width:620px;margin:0 auto}
.cardbox{position:relative;line-height:0;background:#fff}
#card{width:100%;height:auto;display:block}
.hot{position:absolute;left:18%;width:68%;top:60.6%;height:5.2%;display:block}
.hot:focus-visible{outline:3px solid #843f34;outline-offset:2px}
.below{padding:26px 18px 0;text-align:center}
.count{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 30px;margin:0}
.count b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:2.8rem;line-height:1.1}
.count span{font-size:.95rem}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.9rem;margin:34px 0 4px}
.addr{margin:0 0 14px}
.map{width:100%;height:300px;border:0;border-radius:14px;background:var(--panel)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
a.btn,button.btn{display:inline-block;font:inherit;font-weight:500;background:#843f34;color:#fff;border:0;border-radius:999px;padding:11px 24px;text-decoration:none;cursor:pointer}
a.btn.alt,button.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tools{max-width:620px;margin:0 auto 14px;background:#fff6f2;color:#4a2a24;border-bottom:1px solid #efb3a6;padding:18px 18px 16px;text-align:center}
.tools h2{font-size:1.35rem;margin:0 0 6px}
.tools p{margin:2px 0 8px;font-size:.9rem}
.tools input{width:100%;font:inherit;color:#4a2a24;background:#fff;border:1px solid #efb3a6;border-radius:8px;padding:11px;margin:2px 0 6px}
.tools .btns{margin-top:6px}
.tools a:focus-visible,.tools button:focus-visible,.tools input:focus-visible{outline-color:#843f34}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

html.locked,html.locked body{overflow:hidden;height:100%}
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}
#intro .panel{position:absolute;top:0;bottom:0;width:50.5%;transition:transform 2s cubic-bezier(.76,0,.2,1);
  background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 16%,transparent 78%,rgba(0,0,0,.5)),
  repeating-linear-gradient(90deg,rgba(0,0,0,.32) 0,rgba(255,255,255,.09) 15px,rgba(0,0,0,.36) 32px,rgba(0,0,0,.04) 46px),
  linear-gradient(90deg,#7a1224,#9d2036 50%,#6a0f20)}
#intro .pl{left:0;transform-origin:left center;box-shadow:inset -22px 0 34px -12px rgba(0,0,0,.55)}
#intro .pr{right:0;transform-origin:right center;box-shadow:inset 22px 0 34px -12px rgba(0,0,0,.55)}
#intro.open .pl{transform:translateX(-103%) scaleX(.8)}
#intro.open .pr{transform:translateX(103%) scaleX(.8)}
#intro .rod{position:absolute;top:0;left:0;right:0;height:16px;z-index:2;background:linear-gradient(180deg,#f3dc9c,#b8923a 60%,#7a5c1c);box-shadow:0 4px 12px rgba(0,0,0,.45);transition:opacity .6s ease 1.3s}
#intro.open .rod{opacity:0}
#intro .mono{position:relative;z-index:3;text-align:center;transition:opacity .7s ease,transform .7s ease}
#intro.open .mono{opacity:0;transform:scale(.88)}
#intro .ring{width:min(48vw,200px);aspect-ratio:1;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,236,170,.16),rgba(40,0,8,.55));border:2px solid #e2c36e;
  box-shadow:0 0 0 7px #7a1224,0 0 0 9px #e2c36e,0 12px 44px rgba(0,0,0,.55)}
#intro .ring span{font-family:"Great Vibes","Cormorant Garamond",cursive;font-size:clamp(3.4rem,17vw,4.9rem);line-height:1;color:#f1d98e;text-shadow:0 2px 12px rgba(0,0,0,.55)}
#intro .ring i{font-style:normal;font-size:.5em;margin:0 .08em;color:#e2c36e}
#intro .tap{margin-top:36px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:1rem;color:#f1d98e;background:none;border:0;cursor:pointer;padding:8px 14px;animation:pulse 2.2s ease-in-out infinite}
#intro .tap:focus-visible{outline:2px solid #f1d98e;outline-offset:4px}
@keyframes pulse{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){#intro .panel,#intro .mono,#intro .rod{transition-duration:.01s;transition-delay:0s}#intro .tap{animation:none}}
</style>
</head>
<body>

<div id="intro" role="dialog" aria-label="Wedding invitation of Isuri and Chanuka. Tap to open.">
  <div class="panel pl"></div><div class="panel pr"></div><div class="rod"></div>
  <div class="mono">
    <div class="ring" aria-hidden="true"><span>I<i>&amp;</i>C</span></div>
    <button class="tap" type="button" id="openbtn">Tap to open</button>
  </div>
</div>

<div class="tools" id="tools" hidden>
  <h2>Add guest name</h2>
  <p>Type the guest name or names. It is written on the card in the dotted line. Then save the card as a picture to send, or copy a personal link.</p>
  <input id="gname" placeholder="For example: Nimal and Kumari Perera" aria-label="Guest names" autocomplete="off">
  <div class="btns">
    <button class="btn" type="button" id="save">Save card as image</button>
    <button class="btn alt" type="button" id="share" hidden>Share</button>
    <button class="btn alt" type="button" id="copy">Copy personal link</button>
  </div>
  <p id="msg" role="status" style="margin-bottom:0"></p>
</div>

<div class="wrap">
  <div class="cardbox">
    <canvas id="card" width="1240" height="1748" role="img" aria-label="Wedding invitation. The wedding of Isuri and Chanuka. With great pleasure, we cordially invite you to join us in celebrating our wedding ceremony. Your presence and blessings would make our special day truly memorable. Friday, 11 December 2026, 10.00 AM to 4.00 PM, at Sakura Paradise Hotel and Banquet, 7th Mile Post, Kiripedda, Karandeniya."></canvas>
    <a class="hot" id="hot" href="#" target="_blank" rel="noopener" aria-label="Open the venue location in Google Maps"></a>
  </div>

  <div class="below">
    <p class="count" aria-live="polite"><b id="cd">--</b><span>days to go</span></p>

    <p style="margin-top:20px"><a class="btn" id="open" target="_blank" rel="noopener" href="#">Open in Maps</a></p>
  </div>
</div>

    var ws=[],w=0,i;
    for(i=0;i<t.length;i++){var cw=ctx.measureText(t.charAt(i)).width;ws.push(cw);w+=cw+(i<t.length-1?sp:0);}
    var x=cx-w/2;
    for(i=0;i<t.length;i++){ctx.fillText(t.charAt(i),x,y);x+=ws[i]+sp;}
    return w;
  }
  function dots(y,x1,x2){for(var x=x1;x<=x2;x+=13){ctx.beginPath();ctx.arc(x,y,2.4,0,6.2832);ctx.fill();}}
  function draw(){
    if(!ready)return;
    ctx.clearRect(0,0,W,H);ctx.drawImage(base,0,0,W,H);
    ctx.fillStyle=INK;ctx.strokeStyle=INK;ctx.textBaseline="middle";ctx.textAlign="left";
    var cx=620;
    spaced("WITH GREAT PLEASURE, WE CORDIALLY INVITE",cx,560,27,2.6);
    /* guest name on dotted line */
    if(name){
      var size=40,t=name.toUpperCase();
      for(;size>18;size-=1){ctx.font="700 "+size+"px "+FONT;if(ctx.measureText(t).width<=820)break;}
      ctx.textAlign="center";ctx.fillText(t,cx,624);ctx.textAlign="left";
    }
    dots(656,330,910);
    spaced("TO JOIN US IN CELEBRATING OUR WEDDING CEREMONY",cx,716,27,2.4);
    spaced("YOUR PRESENCE AND BLESSINGS WOULD MAKE",cx,766,27,2.4);
    spaced("OUR SPECIAL DAY TRULY MEMORABLE",cx,800,27,2.4);
    /* date: DEC | FRI 11 | 2026 */
    ctx.font="700 66px "+FONT;var wd=ctx.measureText("DEC").width,wy=ctx.measureText("2026").width;
    ctx.font="700 88px "+FONT;var w11=ctx.measureText("11").width;
    ctx.font="700 34px "+FONT;var wf=ctx.measureText("FRI").width,wm=Math.max(w11,wf),gap=32;
    var x=cx-(wd+wm+wy+gap*4)/2;
    ctx.font="700 66px "+FONT;ctx.fillText("DEC",x,912);
    var bx=x+wd+gap;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,856);ctx.lineTo(bx,966);ctx.stroke();
    var mx=bx+gap+wm/2;
    ctx.textAlign="center";ctx.font="700 34px "+FONT;ctx.fillText("FRI",mx,870);
    ctx.font="700 88px "+FONT;ctx.fillText("11",mx,922);ctx.textAlign="left";
    var bx2=bx+gap*2+wm;ctx.beginPath();ctx.moveTo(bx2,856);ctx.lineTo(bx2,966);ctx.stroke();
    ctx.font="700 66px "+FONT;ctx.fillText("2026",bx2+gap,912);
    /* time, ceremony note, venue */
    spaced("10.00 AM - 04.00 PM",cx,1004,38,3);
    ctx.font="600 25px "+FONT;ctx.textAlign="center";ctx.fillText("(Poruwa ceremony at 10.02 am)",cx,1038);
    ctx.font="700 36px "+FONT;ctx.fillText("Sakura Paradise Hotel & Banquet",cx,1078);
    ctx.font="700 28px "+FONT;ctx.fillText("7th Mile Post, Kiripedda, Karandeniya",cx,1112);
    /* map pin icon near the venue */
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(968,1095,30,0,6.2832);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(968,1089,12,Math.PI,0);
    ctx.quadraticCurveTo(980,1101,968,1112);ctx.quadraticCurveTo(956,1101,956,1089);ctx.fill();
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(968,1089,4.5,0,6.2832);ctx.fill();
    ctx.textAlign="left";
  }
  function loadFonts(){
    if(!document.fonts||!document.fonts.load)return;
    Promise.all([document.fonts.load('700 30px "Cormorant Garamond"')]).then(draw,function(){});
  }
  loadFonts();

  /* countdown */
  var target=new Date("2026-12-11T10:00:00").getTime();
  function tick(){document.getElementById("cd").textContent=Math.floor(Math.max(0,target-Date.now())/864e5);}
  tick();setInterval(tick,3600000);

  /* names + edit mode */
  var CLAUDE_URL="https://claude.ai/artifact/NYJC37ygaitM89xGwHDgmC";
  var BASE=(/claude/i.test(location.hostname)||location.protocol==="file:")?CLAUDE_URL:location.href.split("#")[0];
  var input=document.getElementById("gname"),msg=document.getElementById("msg");
  function nice(t){return t.split(/[-_.~]+/).filter(Boolean).map(function(w){var l=w.toLowerCase();return l==="and"?"&":l.charAt(0).toUpperCase()+l.slice(1);}).join(" ");}
  function slug(s){return s.replace(/&/g," and ").replace(/[^\p{L}\p{M}\p{N} ]/gu,"").trim().replace(/\s+/g,"-");}
  function route(){
    var h="";try{h=decodeURIComponent(location.hash.replace("#",""));}catch(e){}
    var edit=(h==="invite-maker");
    document.getElementById("tools").hidden=!edit;
    if(!edit){name=h?nice(h):"";}
    draw();
  }
  route();window.addEventListener("hashchange",route);
  input.addEventListener("input",function(){name=input.value.trim();draw();});

  function blobOf(cb){cv.toBlob(cb,"image/jpeg",.92);}
  function fname(){return "invitation-"+(slug(name)||"card")+".jpg";}
  document.getElementById("save").addEventListener("click",function(){
    blobOf(function(b){
      var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname();
      document.body.appendChild(a);a.click();a.remove();msg.textContent="Saved. Check your downloads.";
    });
  });
  var shareBtn=document.getElementById("share");
  if(navigator.canShare&&navigator.share){shareBtn.hidden=false;}
  shareBtn.addEventListener("click",function(){
    blobOf(function(b){
      var f=new File([b],fname(),{type:"image/jpeg"});
      if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});}
      else{msg.textContent="Sharing is not supported here. Use Save card as image.";}
    });
  });
  document.getElementById("copy").addEventListener("click",function(){
    var s=slug(name);if(!s){msg.textContent="Type a name first.";return;}
    var link=BASE+"#"+s;
    try{navigator.clipboard.writeText(link).then(function(){msg.textContent="Link copied.";},function(){msg.textContent=link;});}
    catch(e){msg.textContent=link;}
  });

  /* curtain intro */
  var intro=document.getElementById("intro"),root=document.documentElement,opened=false;
  var h0="";try{h0=decodeURIComponent(location.hash.replace("#",""));}catch(e){}
  if(h0==="invite-maker"){intro.hidden=true;root.classList.remove("locked");}
  else{
    intro.addEventListener("click",function(){
      if(opened)return;opened=true;intro.classList.add("open");root.classList.remove("locked");
      setTimeout(function(){intro.hidden=true;},2400);
    });
  }
})();
</script>
</body>
